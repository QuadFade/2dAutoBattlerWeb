name: "Deploy Godot Web Build to GitHub Pages"
on:
  push:
    branches:
      - main  # Change to master if your default branch is master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Godot Web Export
        uses: firebelley/godot-export@v5.3.0
        with:
          godot_executable_download_url: https://github.com
          godot_export_templates_download_url: https://github.com
          relative_project_path: ./
          archive_output: false

      - name: Inject COI Service Worker
        run: |
          wget -O build/web/coi-serviceworker.js https://githubusercontent.com

      - name: Upload to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages